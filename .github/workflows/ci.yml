name: CI

on:
  push:
    branches: [main, "work/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes build-essential
      - name: Compile with strict warnings
        run: make
      - name: Run unit tests
        run: make test
      - name: Run address and undefined-behavior sanitizers
        run: make sanitize